<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <title>Strandbad App - Startseite</title>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: linear-gradient(135deg, #e0f2fe 0%, #fef3c7 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0;
    }
    .card {
      background: white;
      padding: 40px;
      border-radius: 24px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.1);
      text-align: center;
      max-width: 400px;
      width: 90%;
    }
    h1 { color: #0284c7; margin-bottom: 10px; font-size: 2rem; }
    p { color: #64748b; margin-bottom: 30px; font-size: 1.1rem; }
    .btn {
      display: block;
      padding: 18px;
      margin: 15px 0;
      background: #0284c7;
      color: white;
      text-decoration: none;
      border-radius: 12px;
      font-size: 1.2rem;
      font-weight: bold;
      box-shadow: 0 4px 10px rgba(2, 132, 199, 0.3);
    }
    .btn-tv {
      background: #16a34a;
      box-shadow: 0 4px 10px rgba(22, 163, 74, 0.3);
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>🌴 Strandbad App 🍹</h1>
    <p>Bitte wähle die Ansicht für dieses Gerät aus:</p>
    <a href="kasse.html" class="btn">📱 Kasse öffnen</a>
    <a href="tv.html" class="btn btn-tv">📺 TV Anzeige öffnen</a>
  </div>
</body>
</html>
